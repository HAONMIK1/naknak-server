spring:
  datasource:
    url: jdbc:tc:postgresql:16:///naknak
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-so-add-more-text-here
  access-token-expiry: 900
  refresh-token-expiry: 1209600

  naver:
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret